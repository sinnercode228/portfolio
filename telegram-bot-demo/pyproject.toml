[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "romashka-lead-bot"
version = "1.0.0"
description = "Telegram-бот для сбора заявок (демо-проект, aiogram 3 + SQLite)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "aiogram>=3.31,<4",
    "aiosqlite>=0.22",
    "python-dotenv>=1.2",
    "tzdata>=2024.1",
]

[project.scripts]
romashka-bot = "bot.main:main"

[project.optional-dependencies]
dev = ["pytest>=9", "pytest-asyncio>=1.4", "ruff>=0.14"]

[tool.setuptools]
packages = ["bot", "bot.handlers", "bot.services"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = ["error::DeprecationWarning:bot.*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.format]
exclude = ["bot/texts.py"]  # тексты оформлены вручную для читаемости

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # кириллица и типографские символы в строках — это нормально

[tool.ruff.lint.isort]
known-first-party = ["bot", "tests"]
