name: CI

on:
  push:
  pull_request:

jobs:
  landing-calculator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing-calculator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [scraper-demo, telegram-bot-demo, excel-dashboard-demo]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.project }}/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: ruff
        if: matrix.project != 'excel-dashboard-demo'
        run: ruff check .
      - run: python -m pytest -q
      - name: check committed workbooks
        if: matrix.project == 'excel-dashboard-demo'
        run: python check_workbook.py output/*.xlsx
